name: Atualizar desempenho Facebook Reels

on:
  push:
    branches: ["main"]
    paths:
      - "automation/facebook_reels_metrics.py"
      - ".github/workflows/facebook-reels-metrics.yml"
  schedule:
    # A cada 3 horas, suficiente para acompanhar as 5 publicações diárias.
    - cron: "25 */3 * * *"
  workflow_dispatch:

concurrency:
  group: viralink-facebook-reels-metrics
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements.txt
      - name: Verificar configuração
        id: config
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "$FACEBOOK_PAGE_ID" ] && [ -n "$FACEBOOK_PAGE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Métricas aguardando os Secrets necessários."
          fi
      - name: Instalar dependências
        if: steps.config.outputs.ready == 'true'
        run: pip install -r automation/requirements.txt
      - name: Sincronizar métricas
        if: steps.config.outputs.ready == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          META_GRAPH_VERSION: v26.0
        run: python automation/facebook_reels_metrics.py
