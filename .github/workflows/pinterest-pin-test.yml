name: Publicar Pins de produtos

on:
  workflow_dispatch:
  schedule:
    # 09h, 12h, 15h, 18h e 21h no horário de Belém (UTC-3)
    - cron: '0 0,12,15,18,21 * * *'
  push:
    paths:
      - '.github/pinterest-pin-test.trigger'

permissions:
  contents: read

concurrency:
  group: pinterest-products
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r automation/requirements.txt

      - name: Abrir conexão protegida
        env:
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
        run: |
          set -euo pipefail
          APP_SECRET="$(printf '%s' "$PINTEREST_APP_SECRET" | tr -d '\r\n')"
          test -n "$APP_SECRET"
          PINTEREST_APP_SECRET="$APP_SECRET" openssl enc -d -aes-256-cbc -pbkdf2 \
            -in automation/pinterest_tokens.enc \
            -out pinterest_tokens.json \
            -pass env:PINTEREST_APP_SECRET

      - name: Criar arte e publicar produto
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PINTEREST_TOKEN_FILE: pinterest_tokens.json
          PINTEREST_API: https://api-sandbox.pinterest.com/v5
        run: python automation/pinterest_pins.py

      - name: Apagar token temporário
        if: always()
        run: rm -f pinterest_tokens.json
