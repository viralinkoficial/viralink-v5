name: Verificar saúde YouTube Shorts

on:
  schedule:
    # Confere o ritmo 30 minutos após cada hora, no período de publicação.
    - cron: "30 9-23,0-2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "automation/youtube_health.py"
      - ".github/workflows/youtube-health.yml"

concurrency:
  group: viralink-youtube-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements.txt
      - run: pip install requests==2.32.4
      - name: Conferir publicações do dia
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python automation/youtube_health.py
