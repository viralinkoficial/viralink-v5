name: Publicar Facebook Reels

on:
  schedule:
    # 09h, 12h, 15h, 18h e 21h em Belém (UTC-3)
    - cron: "0 0,12,15,18,21 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "automation/facebook_reels.py"
      - ".github/workflows/facebook-reels.yml"

concurrency:
  group: viralink-facebook-reels
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[facebook-reels-test]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r automation/requirements.txt
      - name: Criar e publicar um Reel no Facebook
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          META_GRAPH_VERSION: v26.0
          FACEBOOK_REELS_BUCKET: facebook-reels-temp
        run: python automation/facebook_reels.py
