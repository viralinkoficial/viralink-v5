name: Publicar Facebook Reels

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/facebook-reels.yml"
  schedule:
    # 09h, 12h, 15h, 18h e 21h em Belém (UTC-3)
    - cron: "0 0,12,15,18,21 * * *"
  workflow_dispatch:

concurrency:
  group: viralink-facebook-reels
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements.txt

      - name: Verificar configuração do Facebook
        id: facebook_config
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          if [ -n "$FACEBOOK_PAGE_ID" ] && [ -n "$FACEBOOK_PAGE_ACCESS_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Facebook configurado para publicação."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Robô aguardando FACEBOOK_PAGE_ID e FACEBOOK_PAGE_ACCESS_TOKEN nos Secrets do repositório."
          fi

      - name: Instalar FFmpeg
        if: steps.facebook_config.outputs.ready == 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Instalar dependências
        if: steps.facebook_config.outputs.ready == 'true'
        run: pip install -r automation/requirements.txt

      - name: Criar e publicar um Reel no Facebook
        if: steps.facebook_config.outputs.ready == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          META_GRAPH_VERSION: v26.0
          FACEBOOK_REELS_BUCKET: social-videos
        run: python automation/facebook_reels.py
