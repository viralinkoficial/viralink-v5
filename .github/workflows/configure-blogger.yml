name: Configurar credenciais do Blogger

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/configure-blogger.yml"

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Salvar credenciais Google no Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BLOGGER_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          supabase secrets set \
            BLOGGER_BLOG_ID=2124501999986492802 \
            BLOGGER_CLIENT_ID="$BLOGGER_CLIENT_ID" \
            BLOGGER_CLIENT_SECRET="$BLOGGER_CLIENT_SECRET" \
            BLOGGER_REFRESH_TOKEN="$BLOGGER_REFRESH_TOKEN" \
            --project-ref pfbzdktlfdotsgfarhel
