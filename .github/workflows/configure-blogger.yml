name: Configurar credenciais do Blogger

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/configure-blogger.yml"

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Salvar credenciais Google no Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BLOGGER_CLIENT_ID: 8081863130-q3qll2egcjbusnaq237uj64u0odpsufh.apps.googleusercontent.com
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
        run: |
          supabase secrets set \
            BLOGGER_BLOG_ID=2124501999986492802 \
            BLOGGER_CLIENT_ID="$BLOGGER_CLIENT_ID" \
            BLOGGER_CLIENT_SECRET="$BLOGGER_CLIENT_SECRET" \
            BLOGGER_REFRESH_TOKEN="$BLOGGER_REFRESH_TOKEN" \
            --project-ref pfbzdktlfdotsgfarhel
# Execução solicitada após salvar BLOGGER_REFRESH_TOKEN
# Reexecução após atualizar BLOGGER_CLIENT_SECRET
# Reexecução após corrigir BLOGGER_REFRESH_TOKEN
# Reexecução final com refresh token válido
